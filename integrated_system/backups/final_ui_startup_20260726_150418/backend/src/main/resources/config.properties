# Kafka
kafka.bootstrap.servers=localhost:9092
kafka.command.topic=launcher.commands
kafka.status.topic=launcher.status
kafka.telemetry.topic=launcher.telemetry
kafka.reports.topic=launcher.reports
kafka.command.group.id=launcher-backend

# Simulation gRPC bridge
simulation.grpc.host=127.0.0.1
simulation.grpc.port=50052
simulation.grpc.client.id=launcher-backend
simulation.grpc.deadline.ms=750

# Closed-loop gun control
control.enabled=true
control.rate.hz=20
control.muzzle.velocity=18.0
control.fire.retry.interval.ms=1000
control.max.pan.rate=0.20
control.max.tilt.rate=0.10
control.aim.tolerance.deg=1.0
control.pan.kp=2.5
control.pan.ki=0.1
control.pan.kd=0.5
control.tilt.kp=2.5
control.tilt.ki=0.1
control.tilt.kd=0.5

# Ammunition/status
ammo.initial.count=200
ammo.type=76MM
heartbeat.publish.interval.ms=1000
console.fire.enabled=false
